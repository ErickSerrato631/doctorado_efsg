{# Solo nombre + CTA; pipeline, figuras y ecuaciones se cargan en el modal al hacer clic. Requiere: name #}
<div class="col-md-6 col-xl-4">
    <button type="button"
            class="scenario-catalog-open btn btn-link text-decoration-none text-reset p-0 w-100 text-start border-0"
            data-catalog-ajax-url="{% url 'steady_states_app:scenario_catalog_ajax' scenario_name=name %}"
            data-scenario-name="{{ name }}">
        <div class="card h-100 lab-kpi lab-kpi--info border-2 border-transparent shadow-sm scenario-catalog-card">
            <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                    <span class="h6 mb-0 font-monospace text-break">{{ name }}</span>
                    <i class="bi bi-window-stack text-primary flex-shrink-0" title="Abrir catálogo (carga bajo demanda)"></i>
                </div>
                <p class="small text-muted mb-2 mb-md-3">Pipeline, ecuaciones, parámetros y figuras se cargan al abrir el modal.</p>
                <div class="mt-auto pt-1">
                    <span class="btn btn-sm btn-primary">Abrir catálogo</span>
                </div>
            </div>
        </div>
    </button>
</div>
